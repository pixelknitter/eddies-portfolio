name: Preview Cleanup

on:
  pull_request:
    types: [closed]

# Never run two cleanups for the same PR at once.
concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  cleanup:
    name: Tear down preview Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Deleting the Worker also releases its Custom Domain. The KV namespace
      # is a separate resource and is only present when previews were not
      # pinned to a shared one (vars.CF_SESSION_KV_ID), so remove it too.
      # Both steps tolerate "already gone" so re-runs are safe.
      - name: Delete preview Worker and its KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: eddies-portfolio-pr-${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          echo "Deleting Worker: $WORKER"
          if yarn wrangler delete --name "$WORKER" --force 2>&1 | tee /tmp/delete.log; then
            echo "Worker deleted."
          elif grep -qiE "not found|does not exist|10007" /tmp/delete.log; then
            echo "Worker already absent — nothing to do."
          else
            echo "::warning::Could not delete Worker $WORKER; see log above."
          fi

          # Namespaces are titled "<worker-name>-session" by Wrangler.
          ns_title="${WORKER}-session"
          ns_id="$(yarn wrangler kv namespace list 2>/dev/null \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const m=s.match(/\[[\s\S]*\]/); if(!m) return;
                try {
                  const found=JSON.parse(m[0]).find(n=>n.title===process.argv[1]);
                  if(found) process.stdout.write(found.id);
                } catch {}
              })" "$ns_title")"

          if [ -n "$ns_id" ]; then
            echo "Deleting KV namespace $ns_title ($ns_id)"
            yarn wrangler kv namespace delete --namespace-id "$ns_id" --force \
              || echo "::warning::Could not delete KV namespace $ns_id."
          else
            echo "No KV namespace titled $ns_title (previews may share one)."
          fi

      - name: Notify deployments channel
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: info
          title: '🧹 Preview torn down — PR #${{ github.event.pull_request.number }}'
          description: 'Preview Worker and its custom domain were removed.'

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Preview cleanup failed — PR #${{ github.event.pull_request.number }}'
          description: 'The preview Worker may still exist. See the pipeline for logs.'

name: Deploy (staging → production)

on:
  # Runs once CI passes on the default branch.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  # ---------------------------------------------------------------- staging
  # Every green commit on master lands here automatically. Staging is its own
  # Worker on its own hostname, so it can never take over production.
  staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOSTNAME || 'staging.eddie.engineering' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: Verify (check, lint, test)
        run: yarn nx run-many --targets=check,lint,test --projects=web-astro

      # Staging is a pre-production review tier, so it shows unpublished
      # content. The production job below deliberately does not.
      - name: Build
        env:
          PUBLIC_SHOW_UNPUBLISHED: 'true'
          PUBLIC_SHOW_AIR: 'true'
          PUBLIC_SHOW_BLOG: 'true'
          PUBLIC_SHOW_PROJECTS: 'true'
        run: |
          # Stamp the pages with the commit actually checked out, and hand it
          # to the readiness gate so it can confirm this exact build is what
          # the edge is serving before anything is smoke-tested.
          BUILD_SHA="$(git rev-parse HEAD)"
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          PUBLIC_BUILD_SHA="$BUILD_SHA" yarn nx build web-astro

      - name: Generate staging Wrangler config
        env:
          SESSION_KV_ID: ${{ vars.CF_SESSION_KV_ID }}
          STAGING_HOSTNAME: ${{ vars.STAGING_HOSTNAME || 'staging.eddie.engineering' }}
        run: |
          node scripts/make-worker-variant.mjs \
            eddies-portfolio-staging "$STAGING_HOSTNAME" \
            wrangler.staging.json "${SESSION_KV_ID:-}"

      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c packages/web-astro/dist/server/wrangler.staging.json

      - name: Wait for staging to serve this build
        env:
          TARGET_URL: https://${{ vars.STAGING_HOSTNAME || 'staging.eddie.engineering' }}
          # Reachability alone let a stale version through — require the SHA.
          EXPECT_BUILD_SHA: ${{ env.BUILD_SHA }}
        run: ./scripts/wait-for-http.sh "$TARGET_URL"

      - name: Smoke test staging
        env:
          TARGET_URL: https://${{ vars.STAGING_HOSTNAME || 'staging.eddie.engineering' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/smoke-test.mjs "$TARGET_URL"

      # The Pipeline link on this message points at *this* run, where the
      # production job is waiting for approval — so it doubles as the
      # "promote to production" button.
      - name: Notify deployments channel (staging live)
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🧪 Staging deployed — ready to promote'
          description: >-
            Smoke tests passed on staging. Open the Pipeline link below and
            approve the production job to promote this commit.
          result-url: https://${{ vars.STAGING_HOSTNAME || 'staging.eddie.engineering' }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Staging deploy failed'
          description: 'Verification, deployment, or the staging smoke test failed. Production was not attempted.'

  # ------------------------------------------------------------- production
  # Only promotes a commit that is already live and smoke-tested on staging.
  # Add required reviewers to the `production` environment to make this pause
  # for approval — that pause is the promotion gate (see docs/DEPLOYMENT.md).
  production:
    name: Deploy production
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_HOSTNAME || 'eddie.engineering' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: Build
        run: |
          # Stamp the pages with the commit actually checked out, and hand it
          # to the readiness gate so it can confirm this exact build is what
          # the edge is serving before anything is smoke-tested.
          BUILD_SHA="$(git rev-parse HEAD)"
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          PUBLIC_BUILD_SHA="$BUILD_SHA" yarn nx build web-astro

      # Uses the committed wrangler.jsonc as-is, which declares the production
      # custom domain — no variant generation here.
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c packages/web-astro/dist/server/wrangler.json

      - name: Wait for production to serve this build
        env:
          TARGET_URL: https://${{ vars.PRODUCTION_HOSTNAME || 'eddie.engineering' }}
          # Reachability alone let a stale version through — require the SHA.
          EXPECT_BUILD_SHA: ${{ env.BUILD_SHA }}
        run: ./scripts/wait-for-http.sh "$TARGET_URL"

      # Production is public, so this always runs the full assertions.
      - name: Smoke test production
        env:
          TARGET_URL: https://${{ vars.PRODUCTION_HOSTNAME || 'eddie.engineering' }}
          # Production must not expose feature-flagged sections.
          SMOKE_STRICT_FLAGS: 'true'
        run: node scripts/smoke-test.mjs "$TARGET_URL"

      - name: Notify deployments channel (success)
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🚀 Production deployed'
          description: 'Promoted from staging. Smoke tests passed against the live site.'
          result-url: https://${{ vars.PRODUCTION_HOSTNAME || 'eddie.engineering' }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Production deploy failed'
          description: 'Deployment or the production smoke test failed. See the pipeline for logs.'

name: Deploy to Cloudflare Pages

on:
  # Deploy only after CI passes on the default branch.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # Guard: only run if the triggering CI run succeeded (or manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Cloudflare + Discord credentials are stored as *environment* secrets,
    # so the job must declare the environment to read them.
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Re-verify at the deployed commit. CI already ran, but this job can also
      # be dispatched manually against any ref.
      - name: Verify (check, lint, test)
        run: yarn nx run-many --targets=check,lint,test --projects=web-astro

      - name: Build
        run: yarn nx build web-astro

      # The Astro Cloudflare adapter targets Workers (it dropped Pages
      # support), emitting dist/server/wrangler.json with the entry point,
      # the static-asset binding (../client) and the session KV binding.
      - name: Publish to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c packages/web-astro/dist/server/wrangler.json

      - name: Resolve production URL
        id: url
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          CMD_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          set -euo pipefail
          url="$DEPLOY_URL"
          if [ -z "$url" ]; then
            url="$(printf '%s' "$CMD_OUTPUT" \
              | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1 || true)"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: ${url:-<none>}"

      # Production is public, so this runs the full assertions with no token.
      - name: Smoke test production
        env:
          PROD_URL: ${{ steps.url.outputs.url }}
        run: node scripts/smoke-test.mjs "$PROD_URL"

      - name: Notify deployments channel (success)
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🚀 Production deployed'
          description: 'Smoke tests passed against the live deployment.'
          result-url: ${{ steps.url.outputs.url }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Production deploy failed'
          description: 'Verification, deployment, or the post-deploy smoke test failed. See the pipeline for logs.'

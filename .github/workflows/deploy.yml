name: Deploy to Cloudflare Pages

on:
  # Deploy only after CI passes on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # Guard: only run if the triggering CI run succeeded (or manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Cloudflare + Discord credentials are stored as *environment* secrets,
    # so the job must declare the environment to read them.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 3)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn nx build web-astro

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy packages/web-astro/dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'eddies-portfolio' }}
            --branch=main

      - name: Notify deployments channel (success)
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🚀 Production deployed'
          description: 'eddies-portfolio is live on Cloudflare Pages.'
          result-url: ${{ steps.deploy.outputs.deployment-url }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Production deploy failed'
          description: 'The production build or deployment failed. See the pipeline for logs.'

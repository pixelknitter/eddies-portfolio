name: Deploy to Cloudflare Pages

on:
  # Deploy only after CI passes on the default branch.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # Guard: only run if the triggering CI run succeeded (or manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Cloudflare + Discord credentials are stored as *environment* secrets,
    # so the job must declare the environment to read them.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Re-verify at the deployed commit. CI already ran, but this job can also
      # be dispatched manually against any ref.
      - name: Verify (check, lint, test)
        run: yarn nx run-many --targets=check,lint,test --projects=web-astro

      - name: Build
        run: yarn nx build web-astro

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch` must match the Pages project's production branch,
          # otherwise this lands as a preview deployment.
          command: >-
            pages deploy dist/packages/web-astro
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'eddies-portfolio' }}
            --branch=master

      # Production is public, so this runs the full assertions with no token.
      - name: Smoke test production
        env:
          PROD_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/smoke-test.mjs "$PROD_URL"

      - name: Notify deployments channel (success)
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🚀 Production deployed'
          description: 'Smoke tests passed against the live deployment.'
          result-url: ${{ steps.deploy.outputs.deployment-url }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Production deploy failed'
          description: 'Verification, deployment, or the post-deploy smoke test failed. See the pipeline for logs.'

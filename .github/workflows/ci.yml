name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded pull-request runs to save CI minutes, but never cancel a
# run on master.
#
# A cancelled run leaves its required checks in a non-passing state on that
# commit. On a PR that is harmless — a newer push replaces it. On master it is
# not: "Require branches to be up to date" compares against master's head, so a
# commit whose checks were cancelled can block the next PR from merging with no
# obvious cause.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Nx daemon adds no value for single-run ephemeral CI and can be flaky.
  NX_DAEMON: 'false'

jobs:
  verify:
    # Name kept short and stable: this string is a required status check in
    # the branch ruleset, so changing it silently unprotects master.
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nx needs history to compute affected projects on PRs.
          fetch-depth: 0

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Runs before the tests, not after: the A.I.R. eval suite reads the real
      # corpus off disk and arms its grounding assertions only when a non-sample
      # story is present. With this step later, those assertions skipped in every
      # CI run ever made, and a suggested question with nothing behind it passed.
      #
      # Sealed posts are encrypted in the repo. Forks cannot read the key, so
      # this warns and builds without them rather than failing a contribution
      # over content it has no business seeing.
      - name: Unseal scheduled content
        env:
          CONTENT_SEAL_KEY: ${{ secrets.CONTENT_SEAL_KEY }}
        run: node scripts/seal-content.mjs unseal-all

      - name: Type-check
        run: yarn nx check web-astro

      - name: Lint
        run: yarn nx lint web-astro

      - name: Unit tests
        run: yarn nx test web-astro


      # Needs no key: reads frontmatter of already-public files, so it enforces
      # on fork pull requests where `check` can only report.
      - name: Audit that no unpublished content is committed in plaintext
        run: node scripts/seal-content.mjs audit

      - name: Check no sealed file's plaintext is committed
        env:
          CONTENT_SEAL_KEY: ${{ secrets.CONTENT_SEAL_KEY }}
        run: node scripts/seal-content.mjs check

      - name: Build
        run: yarn nx build web-astro

      # Astro inlines the build machine's process.env into the server bundle,
      # so a secret present during the build ships inside the Worker. Found by
      # grepping a local build; this is what keeps it from recurring.
      - name: Scan build output for secrets
        run: node scripts/check-bundle-secrets.mjs

      # The Discord webhooks are repo-level secrets, so this needs no
      # `environment:` and can live in the same job.
      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ CI failed on ${{ github.ref_name }}'
          description: 'Type-check, lint, test, or build failed. See the pipeline for logs.'

  e2e:
    # Also a ruleset contract name — see the note on `tests` above.
    name: e2e
    runs-on: ubuntu-latest
    # Runs after verify so an E2E failure is unambiguous: the unit suite and
    # build already passed, so the fault is in the served application.
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Only Chromium — the suite's two projects are both Chromium-based, so
      # downloading Firefox and WebKit would be pure CI time.
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      # The webServer in playwright.config.ts builds the site and serves the
      # real Worker via `wrangler dev --local`, so this exercises the same
      # runtime that production uses rather than a dev server.
      - name: Run E2E suite
        run: yarn nx e2e web-astro-e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web-astro-e2e/playwright-report/
          retention-days: 7

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ E2E failed on ${{ github.ref_name }}'
          description: 'The Playwright suite failed against the built Worker. The report is attached to the run as an artifact.'

name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview per PR; newer pushes supersede in-flight runs.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  preview:
    name: Build & deploy preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 3)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn nx build web-astro

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy under the PR's branch so Cloudflare creates a stable
          # per-branch preview alias. Gate these previews with Cloudflare
          # Access (see docs/DEPLOYMENT.md).
          command: >-
            pages deploy packages/web-astro/dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'eddies-portfolio' }}
            --branch=${{ github.head_ref }}

      - name: Comment preview URL on the PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n### 🔎 Preview deployment\n\n`
              + `**URL:** ${url}\n\n`
              + `_Private — access is gated by Cloudflare Access. `
              + `Commit \`${context.sha.substring(0,7)}\`._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Notify deployments channel (success)
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🔎 Preview deployed — PR #${{ github.event.pull_request.number }}'
          description: ${{ github.event.pull_request.title }}
          result-url: ${{ steps.deploy.outputs.deployment-url }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Preview deploy failed — PR #${{ github.event.pull_request.number }}'
          description: 'The preview build or deployment failed. See the pipeline for logs.'

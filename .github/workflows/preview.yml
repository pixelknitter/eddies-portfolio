name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview per PR; newer pushes supersede in-flight runs.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  preview:
    name: Build & deploy preview
    runs-on: ubuntu-latest
    # Credentials are repo-level secrets; the environment is declared for
    # GitHub deployment tracking, the environment URL, and optional
    # protection rules (env-level secrets still override when set).
    environment:
      name: staging
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Never ship a preview that would not have passed CI.
      - name: Type-check
        run: yarn nx check web-astro

      - name: Lint
        run: yarn nx lint web-astro

      - name: Unit tests
        run: yarn nx test web-astro

      - name: Build
        run: yarn nx build web-astro

      # Preview URLs cannot be served on a custom domain, so a preview that
      # needs a real hostname must be its own Worker with its own Custom
      # Domain. Derive both from the branch name — read from env and
      # slugified, since branch names are attacker-controllable and must also
      # be a valid DNS label.
      - name: Compute preview identity
        id: meta
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'eddie.engineering' }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9-' '-' \
            | sed -E 's/-+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-30 \
            | sed -E 's/-+$//')"
          [ -n "$slug" ] || slug="pr-${PR_NUMBER}"
          # Worker is named by PR number so cleanup on close is unambiguous.
          worker="eddies-portfolio-pr-${PR_NUMBER}"
          hostname="${slug}-staging.${PREVIEW_DOMAIN}"
          echo "worker=${worker}" >> "$GITHUB_OUTPUT"
          echo "hostname=${hostname}" >> "$GITHUB_OUTPUT"
          echo "Worker:   ${worker}"
          echo "Hostname: ${hostname}"

      - name: Generate preview Wrangler config
        env:
          SESSION_KV_ID: ${{ vars.CF_SESSION_KV_ID }}
          WORKER: ${{ steps.meta.outputs.worker }}
          HOSTNAME_OUT: ${{ steps.meta.outputs.hostname }}
        run: |
          node scripts/make-preview-wrangler.mjs \
            "$WORKER" "$HOSTNAME_OUT" "${SESSION_KV_ID:-}"

      - name: Deploy preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c packages/web-astro/dist/server/wrangler.preview.json

      - name: Resolve preview URL
        id: preview
        env:
          HOSTNAME_OUT: ${{ steps.meta.outputs.hostname }}
        run: |
          set -euo pipefail
          echo "url=https://${HOSTNAME_OUT}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: https://${HOSTNAME_OUT}"

      # A newly-created Custom Domain needs DNS + edge certificate propagation
      # before it answers, so wait for it rather than letting the smoke test
      # fail on a cold hostname.
      - name: Wait for the preview hostname to respond
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            # Assign the fallback separately: `$(curl … || echo 000)` would
            # concatenate curl's own "000" with the echo, yielding "000000"
            # and passing the check on a host that never answered.
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PREVIEW_URL")" || code="000"
            # Any HTTP answer means DNS + TLS are live (302 = Access login).
            if [ "$code" != "000" ]; then
              echo "Hostname responding after ${attempt} attempt(s) (HTTP $code)."
              exit 0
            fi
            echo "  attempt ${attempt}: no response yet, waiting…"
            sleep 10
          done
          echo "::error::Preview hostname did not respond within ~5 minutes."
          exit 1

      # Validate the deployment actually serves before calling it a success.
      # Previews are gated by Cloudflare Access: without a service token the
      # script reports that and skips rather than silently passing against the
      # Access login page.
      - name: Smoke test the deployment
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/smoke-test.mjs "$PREVIEW_URL"

      - name: Comment preview URL on the PR
        if: success()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n### 🔎 Preview deployment\n\n`
              + `**URL:** ${url}\n\n`
              + `Smoke tests passed against this deployment. `
              + `_Private — access is gated by Cloudflare Access. `
              + `Commit \`${context.sha.substring(0,7)}\`._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Notify deployments channel (success)
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🔎 Preview deployed — PR #${{ github.event.pull_request.number }}'
          description: ${{ github.event.pull_request.title }}
          result-url: ${{ steps.preview.outputs.url }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Preview failed — PR #${{ github.event.pull_request.number }}'
          description: 'Verification, deployment, or the post-deploy smoke test failed. See the pipeline for logs.'

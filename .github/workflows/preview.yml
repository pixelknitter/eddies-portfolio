name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview per PR; newer pushes supersede in-flight runs.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  preview:
    name: Build & deploy preview
    runs-on: ubuntu-latest
    # Cloudflare + Discord credentials are stored as *environment* secrets,
    # so the job must declare the environment to read them.
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 3)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn nx build web-astro

      # Never interpolate `github.head_ref` straight into a command: branch
      # names are attacker-controllable. Read it from env and reduce it to a
      # DNS-safe slug, which is also what Cloudflare needs for a branch alias.
      - name: Compute preview branch alias
        id: meta
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9-' '-' \
            | sed -E 's/-+/-/g; s/^-//; s/-$//' \
            | cut -c1-28 \
            | sed -E 's/-$//')"
          [ -n "$slug" ] || slug="pr-${{ github.event.pull_request.number }}"
          echo "branch=$slug" >> "$GITHUB_OUTPUT"
          echo "Preview branch alias: $slug"

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy under a sanitized branch slug so Cloudflare creates a stable
          # per-branch preview alias. Gate these previews with Cloudflare
          # Access (see docs/DEPLOYMENT.md).
          command: >-
            pages deploy packages/web-astro/dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'eddies-portfolio' }}
            --branch=${{ steps.meta.outputs.branch }}

      - name: Comment preview URL on the PR
        if: success()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n### 🔎 Preview deployment\n\n`
              + `**URL:** ${url}\n\n`
              + `_Private — access is gated by Cloudflare Access. `
              + `Commit \`${context.sha.substring(0,7)}\`._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Notify deployments channel (success)
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🔎 Preview deployed — PR #${{ github.event.pull_request.number }}'
          description: ${{ github.event.pull_request.title }}
          result-url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Preview deploy failed — PR #${{ github.event.pull_request.number }}'
          description: 'The preview build or deployment failed. See the pipeline for logs.'

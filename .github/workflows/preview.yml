name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One preview per PR; newer pushes supersede in-flight runs.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  preview:
    name: Build & deploy preview
    runs-on: ubuntu-latest
    # Cloudflare + Discord credentials are stored as *environment* secrets,
    # so the job must declare the environment to read them.
    environment:
      name: staging
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Never ship a preview that would not have passed CI.
      - name: Type-check
        run: yarn nx check web-astro

      - name: Lint
        run: yarn nx lint web-astro

      - name: Unit tests
        run: yarn nx test web-astro

      - name: Build
        run: yarn nx build web-astro

      # Upload a new Worker version *without* promoting it to production and
      # give it a stable per-PR alias. The alias is derived from the numeric
      # PR number, so it is inherently safe to interpolate and always a valid
      # DNS label. Gate preview URLs with Cloudflare Access (docs/DEPLOYMENT.md).
      - name: Upload preview version to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload
            -c packages/web-astro/dist/server/wrangler.json
            --preview-alias pr-${{ github.event.pull_request.number }}

      # wrangler-action does not populate `deployment-url` for `versions
      # upload` (cloudflare/wrangler-action#343), so parse the command output.
      # Prefer the stable alias URL over the per-version one.
      - name: Resolve preview URL
        id: preview
        env:
          CMD_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          alias_url="$(printf '%s' "$CMD_OUTPUT" \
            | grep -oE "https://pr-${PR_NUMBER}-[a-z0-9.-]+\.workers\.dev" | head -1 || true)"
          any_url="$(printf '%s' "$CMD_OUTPUT" \
            | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1 || true)"
          url="${alias_url:-$any_url}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${url:-<none>}"
          [ -n "$url" ] || echo "::warning::Could not parse a preview URL from wrangler output."

      # Validate the deployment actually serves before calling it a success.
      # Previews are gated by Cloudflare Access: without a service token the
      # script reports that and skips rather than silently passing against the
      # Access login page.
      - name: Smoke test the deployment
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/smoke-test.mjs "$PREVIEW_URL"

      - name: Comment preview URL on the PR
        if: success()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n### 🔎 Preview deployment\n\n`
              + `**URL:** ${url}\n\n`
              + `Smoke tests passed against this deployment. `
              + `_Private — access is gated by Cloudflare Access. `
              + `Commit \`${context.sha.substring(0,7)}\`._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Notify deployments channel (success)
        if: success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🔎 Preview deployed — PR #${{ github.event.pull_request.number }}'
          description: ${{ github.event.pull_request.title }}
          result-url: ${{ steps.preview.outputs.url }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Preview failed — PR #${{ github.event.pull_request.number }}'
          description: 'Verification, deployment, or the post-deploy smoke test failed. See the pipeline for logs.'

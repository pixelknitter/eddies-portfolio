name: Dev Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Deliberately no `paths-ignore` here. Filtering at the workflow level
    # means a docs-only PR never starts the workflow at all, so a required
    # status check for this job would sit Pending forever and block the merge.
    # The filter lives in the `changes` job below instead: a job skipped by an
    # `if:` still reports a conclusion, which satisfies a required check.

# One preview per PR; newer pushes supersede in-flight runs.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'

jobs:
  # Decides whether the PR can change what gets served. A preview provisions a
  # Worker, a Custom Domain and a DNS record, so it is not worth spending on a
  # PR that cannot affect the site.
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed to diff against the merge base rather than a shallow tip.
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Three dots: changes on this branch since it diverged, so commits
          # landing on master meanwhile do not count as this PR's changes.
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # A denylist rather than an allowlist on purpose: a new directory
          # should default to *getting* a preview. Silently skipping a
          # deployable change is the worse failure.
          #
          # `^[^/]+\.md$` is root-level markdown only, so posts under
          # src/content/**/*.md still count as deployable content.
          ignored='^(docs/|\.vscode/|LICENSE$|\.editorconfig$|\.gitignore$|\.prettierignore$|[^/]+\.md$)'

          if echo "$changed" | grep -qvE "$ignored"; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "→ deployable changes present; preview will run."
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "→ documentation-only change; skipping the preview."
          fi

  # The deployment itself, which genuinely should not run for a docs-only
  # change. The required status check is the `preview` gate at the bottom of
  # this file, NOT this job — see the comment there for why the two are split.
  deploy:
    name: deploy
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    # Credentials are repo-level secrets; the environment is declared for
    # GitHub deployment tracking, the environment URL, and optional
    # protection rules (env-level secrets still override when set).
    environment:
      name: development
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Without this the preview builds from only the sample fixtures, because
      # real posts exist in the repo *only* as encrypted blobs — their plaintext
      # lives in gitignored .local-* directories that never reach CI. The
      # PUBLIC_SHOW_* flags below were doing their job; there was nothing behind
      # them to reveal.
      #
      # --require-key because a preview whose whole purpose is reviewing
      # unpublished work must fail loudly rather than quietly show placeholders.
      - name: Unseal scheduled content
        env:
          CONTENT_SEAL_KEY: ${{ secrets.CONTENT_SEAL_KEY }}
        run: node scripts/seal-content.mjs unseal-all --require-key

      # Never ship a preview that would not have passed CI.
      - name: Type-check
        run: yarn nx check web-astro

      - name: Lint
        run: yarn nx lint web-astro

      - name: Unit tests
        run: yarn nx test web-astro


      # Dev previews exist to review work in progress, so they reveal drafts
      # and scheduled posts. Production never sets this.
      - name: Build
        env:
          PUBLIC_SHOW_UNPUBLISHED: 'true'
          # Add the `show-fixtures` label to a PR to include sample-*.md in its
          # preview — useful when a branch's real content is too thin to judge a
          # section's layout. A label is the toggle here because it is already a
          # switch in the PR sidebar and re-running the workflow picks it up,
          # with no committed change that could follow the branch to production.
          #
          # `contains` yields the strings 'true'/'false', which is exactly what
          # the flag helper compares against.
          PUBLIC_SHOW_FIXTURES:
            ${{ contains(github.event.pull_request.labels.*.name, 'show-fixtures') }}
          PUBLIC_SHOW_AIR: 'true'
          PUBLIC_SHOW_RESUME: 'true'
          PUBLIC_SHOW_BLOG: 'true'
          PUBLIC_SHOW_PROJECTS: 'true'
          PUBLIC_SHOW_HIGHLIGHTS: 'true'
          # Previews share the one PostHog project with staging and production;
          # events carry the tier so they stay separable. Unset means the runtime
          # flag layer has no opinion and the flags above stand alone — which is
          # also what happens on a fork PR, where `vars` is not available.
          PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
        run: yarn nx build web-astro

      # Preview URLs cannot be served on a custom domain, so a preview that
      # needs a real hostname must be its own Worker with its own Custom
      # Domain. Derive both from the branch name — read from env and
      # slugified, since branch names are attacker-controllable and must also
      # be a valid DNS label.
      - name: Compute preview identity
        id: meta
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'eddie.engineering' }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9-' '-' \
            | sed -E 's/-+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-30 \
            | sed -E 's/-+$//')"
          [ -n "$slug" ] || slug="pr-${PR_NUMBER}"
          # Worker is named by PR number so cleanup on close is unambiguous.
          worker="eddies-portfolio-pr-${PR_NUMBER}"
          hostname="${slug}-dev.${PREVIEW_DOMAIN}"
          echo "worker=${worker}" >> "$GITHUB_OUTPUT"
          echo "hostname=${hostname}" >> "$GITHUB_OUTPUT"
          echo "Worker:   ${worker}"
          echo "Hostname: ${hostname}"

      - name: Generate dev Wrangler config
        env:
          SESSION_KV_ID: ${{ vars.CF_SESSION_KV_ID }}
          WORKER: ${{ steps.meta.outputs.worker }}
          HOSTNAME_OUT: ${{ steps.meta.outputs.hostname }}
        run: |
          node scripts/make-worker-variant.mjs \
            "$WORKER" "$HOSTNAME_OUT" wrangler.dev.json "${SESSION_KV_ID:-}"

      - name: Deploy dev preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c packages/web-astro/dist/server/wrangler.dev.json

      # A preview Worker starts with no secrets. `wrangler secret put` is
      # per-Worker and every PR creates a new one, so A.I.R. answered "available
      # by invitation" and access requests returned 503 on every preview ever
      # deployed. Nothing was misconfigured — there was nothing configured.
      #
      # The code and signing secret are generated per deploy rather than read
      # from repository secrets: a throwaway environment should never hold the
      # credential that opens production. The code is surfaced on the PR so it
      # can actually be used.
      - name: Seed preview secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ steps.meta.outputs.worker }}
          DISCORD_ACCESS_WEBHOOK_URL: ${{ secrets.DISCORD_ACCESS_WEBHOOK_URL }}
          # Fallback: the access webhook was only ever set as a Worker secret on
          # production and staging, never as a repository secret, so previews had
          # nothing to send to. The deploy webhook is already a repository secret
          # and reaches the same person — wrong channel beats a dead flow on a
          # throwaway environment. Set DISCORD_ACCESS_WEBHOOK_URL as a repo secret
          # to route preview requests to the right channel instead.
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          # Typable rather than hex: this gets read off a PR comment and entered
          # by hand, sometimes on a phone.
          code="preview-$(openssl rand -hex 4)"
          signing="$(openssl rand -hex 32)"
          echo "::add-mask::$signing"

          put() {
            printf '%s' "$2" | npx wrangler secret put "$1" --name "$WORKER" >/dev/null
            echo "  set $1"
          }

          put AIR_ACCESS_CODE "$code"
          put AIR_SIGNING_SECRET "$signing"

          # Real credentials, so forwarded only if the repository has them — a
          # preview without them degrades to a working UI that reports the gap,
          # rather than failing the deploy.
          webhook="${DISCORD_ACCESS_WEBHOOK_URL:-${DISCORD_DEPLOY_WEBHOOK_URL:-}}"
          if [ -n "$webhook" ]; then
            put DISCORD_ACCESS_WEBHOOK_URL "$webhook"
            if [ -z "${DISCORD_ACCESS_WEBHOOK_URL:-}" ]; then
              echo "  … using the deploy webhook; requests land in the deploys channel"
            fi
          else
            echo "  ! no Discord webhook available — access requests will 503"
          fi

          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            put ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          else
            echo "  ! ANTHROPIC_API_KEY unset — asking will fail"
          fi

          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Resolve preview URL
        id: preview
        env:
          HOSTNAME_OUT: ${{ steps.meta.outputs.hostname }}
        run: |
          set -euo pipefail
          echo "url=https://${HOSTNAME_OUT}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: https://${HOSTNAME_OUT}"

      - name: Wait for the preview hostname to respond
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: ./scripts/wait-for-http.sh "$PREVIEW_URL"

      # Validate the deployment actually serves before calling it a success.
      #
      # The service token is here for when an Access policy covers the preview
      # hostname; the script reports and skips rather than silently passing
      # against an Access login page. As of 2026-07-29 no policy covers
      # *-dev.eddie.engineering — a credential-less request returns 200 — so
      # previews are public. See docs/DEPLOYMENT.md.
      - name: Smoke test the deployment
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/smoke-test.mjs "$PREVIEW_URL"

      # The upserted comment doubles as the "already announced" marker: if it
      # was missing, this is the PR's first successful preview, which is the
      # only success worth pinging Discord about (the URL is stable per PR).
      - name: Comment preview URL on the PR
        id: comment
        if: success()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          AIR_CODE: ${{ steps.secrets.outputs.code }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const airCode = process.env.AIR_CODE;
            const marker = '<!-- preview-deploy -->';
            // The code is regenerated on every deploy, so the comment is the
            // only place it exists — state that, or the next push looks broken.
            const air = airCode
              ? `**A.I.R. code:** \`${airCode}\` — regenerated on each deploy, `
                + `valid only for this preview.\n\n`
              : '';
            const body = `${marker}\n### 🔎 Preview deployment\n\n`
              + `**URL:** ${url}\n\n`
              + air
              + `Smoke tests passed against this deployment. `
              + `_This hostname is publicly reachable — treat anything here as public. `
              + `Commit \`${context.sha.substring(0,7)}\`._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
            core.setOutput('first', existing ? 'false' : 'true');

      # Announce only the first successful preview per PR. Every later push
      # updates the same comment silently — the URL never changes, so repeat
      # pings are pure noise. Failures always notify (see the next step).
      # Override with the PREVIEW_DEPLOY_NOTIFY variable: `always` or `never`.
      - name: Notify deployments channel (first successful preview)
        if: >-
          success() &&
          (vars.PREVIEW_DEPLOY_NOTIFY == 'always' ||
           (vars.PREVIEW_DEPLOY_NOTIFY != 'never' &&
            steps.comment.outputs.first == 'true'))
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🔎 Preview deployed — PR #${{ github.event.pull_request.number }}'
          description: ${{ github.event.pull_request.title }}
          result-url: ${{ steps.preview.outputs.url }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Preview failed — PR #${{ github.event.pull_request.number }}'
          description: 'Verification, deployment, or the post-deploy smoke test failed. See the pipeline for logs.'

  # The required status check, deliberately separate from the job that deploys.
  #
  # `preview` is listed in the branch's required_status_checks.contexts, and
  # GitHub does not treat a *skipped* required check as satisfied. The checks
  # summary disagrees — it renders "All checks have passed" — but protection
  # evaluates the context on its own and sees no successful conclusion, so the
  # merge box reads "Cannot merge at this time". Putting the deployable
  # condition directly on the deploying job is therefore what made every
  # docs-only pull request unmergeable, with a green tick next to it.
  #
  # This job always runs and always reports a real conclusion. A skipped
  # deployment is a pass, because "there was nothing to deploy" is a correct
  # outcome for a docs change, not a missing one.
  preview:
    # Ruleset contract name — see .github/workflows/ci.yml. Renaming this
    # silently unprotects master.
    name: preview
    needs: [changes, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the deployment outcome
        env:
          # Indirected through env rather than interpolated into the script
          # body. These two are controlled values, but the habit is what stops
          # an attacker-supplied field ever reaching a shell here.
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOYABLE: ${{ needs.changes.outputs.deployable }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT  deployable=$DEPLOYABLE  deploy=$DEPLOY_RESULT"

          # Guarded explicitly: if classification failed, `deploy` is skipped
          # for the wrong reason, and reporting that as a pass would be exactly
          # the false green this job exists to prevent.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "✖ could not classify the changed paths ($CHANGES_RESULT)" >&2
            exit 1
          fi

          case "$DEPLOY_RESULT" in
            success)
              echo "✓ preview deployed" ;;
            skipped)
              echo "✓ documentation-only change; nothing to deploy" ;;
            *)
              echo "✖ the preview deployment did not succeed ($DEPLOY_RESULT)" >&2
              exit 1 ;;
          esac

name: Dev Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # A preview provisions a Worker, a Custom Domain and a DNS record, so it
    # is not worth spending on a PR that cannot change what gets served.
    #
    # This is a denylist rather than an allowlist on purpose: a new directory
    # should default to *getting* a preview. Silently skipping a deployable
    # change is the worse failure.
    #
    # Note `*.md` matches only root-level files (a path filter's `*` does not
    # cross `/`), so posts under src/content/**/*.md still trigger a preview —
    # those are deployable content.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.vscode/**'
      - '.editorconfig'
      - '.gitignore'
      - '.prettierignore'

# One preview per PR; newer pushes supersede in-flight runs.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CYPRESS_INSTALL_BINARY: '0'
  NX_DAEMON: 'false'

jobs:
  preview:
    name: Build & deploy preview
    runs-on: ubuntu-latest
    # Credentials are repo-level secrets; the environment is declared for
    # GitHub deployment tracking, the environment URL, and optional
    # protection rules (env-level secrets still override when set).
    environment:
      name: development
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Never ship a preview that would not have passed CI.
      - name: Type-check
        run: yarn nx check web-astro

      - name: Lint
        run: yarn nx lint web-astro

      - name: Unit tests
        run: yarn nx test web-astro

      # Dev previews exist to review work in progress, so they reveal drafts
      # and scheduled posts. Production never sets this.
      - name: Build
        env:
          PUBLIC_SHOW_UNPUBLISHED: 'true'
        run: yarn nx build web-astro

      # Preview URLs cannot be served on a custom domain, so a preview that
      # needs a real hostname must be its own Worker with its own Custom
      # Domain. Derive both from the branch name — read from env and
      # slugified, since branch names are attacker-controllable and must also
      # be a valid DNS label.
      - name: Compute preview identity
        id: meta
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'eddie.engineering' }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9-' '-' \
            | sed -E 's/-+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-30 \
            | sed -E 's/-+$//')"
          [ -n "$slug" ] || slug="pr-${PR_NUMBER}"
          # Worker is named by PR number so cleanup on close is unambiguous.
          worker="eddies-portfolio-pr-${PR_NUMBER}"
          hostname="${slug}-dev.${PREVIEW_DOMAIN}"
          echo "worker=${worker}" >> "$GITHUB_OUTPUT"
          echo "hostname=${hostname}" >> "$GITHUB_OUTPUT"
          echo "Worker:   ${worker}"
          echo "Hostname: ${hostname}"

      - name: Generate dev Wrangler config
        env:
          SESSION_KV_ID: ${{ vars.CF_SESSION_KV_ID }}
          WORKER: ${{ steps.meta.outputs.worker }}
          HOSTNAME_OUT: ${{ steps.meta.outputs.hostname }}
        run: |
          node scripts/make-worker-variant.mjs \
            "$WORKER" "$HOSTNAME_OUT" wrangler.dev.json "${SESSION_KV_ID:-}"

      - name: Deploy dev preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c packages/web-astro/dist/server/wrangler.dev.json

      - name: Resolve preview URL
        id: preview
        env:
          HOSTNAME_OUT: ${{ steps.meta.outputs.hostname }}
        run: |
          set -euo pipefail
          echo "url=https://${HOSTNAME_OUT}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: https://${HOSTNAME_OUT}"

      - name: Wait for the preview hostname to respond
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: ./scripts/wait-for-http.sh "$PREVIEW_URL"

      # Validate the deployment actually serves before calling it a success.
      # Previews are gated by Cloudflare Access: without a service token the
      # script reports that and skips rather than silently passing against the
      # Access login page.
      - name: Smoke test the deployment
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/smoke-test.mjs "$PREVIEW_URL"

      # The upserted comment doubles as the "already announced" marker: if it
      # was missing, this is the PR's first successful preview, which is the
      # only success worth pinging Discord about (the URL is stable per PR).
      - name: Comment preview URL on the PR
        id: comment
        if: success()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n### 🔎 Preview deployment\n\n`
              + `**URL:** ${url}\n\n`
              + `Smoke tests passed against this deployment. `
              + `_Private — access is gated by Cloudflare Access. `
              + `Commit \`${context.sha.substring(0,7)}\`._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
            core.setOutput('first', existing ? 'false' : 'true');

      # Announce only the first successful preview per PR. Every later push
      # updates the same comment silently — the URL never changes, so repeat
      # pings are pure noise. Failures always notify (see the next step).
      # Override with the PREVIEW_DEPLOY_NOTIFY variable: `always` or `never`.
      - name: Notify deployments channel (first successful preview)
        if: >-
          success() &&
          (vars.PREVIEW_DEPLOY_NOTIFY == 'always' ||
           (vars.PREVIEW_DEPLOY_NOTIFY != 'never' &&
            steps.comment.outputs.first == 'true'))
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: '🔎 Preview deployed — PR #${{ github.event.pull_request.number }}'
          description: ${{ github.event.pull_request.title }}
          result-url: ${{ steps.preview.outputs.url }}

      - name: Notify alerts channel (failure)
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          status: failure
          title: '❌ Preview failed — PR #${{ github.event.pull_request.number }}'
          description: 'Verification, deployment, or the post-deploy smoke test failed. See the pipeline for logs.'
